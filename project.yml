name: QuickCar
options:
  bundleIdPrefix: com.muhammetkocyigit
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "9G9C976675"
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  QuickCar:
    type: application
    platform: iOS
    sources:
      - path: QuickCar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muhammetkocyigit.quickcar
        INFOPLIST_FILE: QuickCar/Info.plist
        # Personal Team cannot provision CarPlay Driving Task on device.
        # Default = CarPlay (Simulator). Device SDK strips to empty entitlements.
        CODE_SIGN_ENTITLEMENTS: QuickCar/Resources/QuickCar-CarPlay.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": QuickCar/Resources/QuickCar.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_TESTABILITY: YES
    # Free Personal Team: widgets/App Groups disabled for local device install
    # dependencies:
    #   - target: QuickCarWidgets
    #     embed: true

  QuickCarWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: QuickCarWidgets
      - path: QuickCar/Core/LiveActivity/TripActivityAttributes.swift
      - path: QuickCar/Core/Widgets/WidgetDataStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muhammetkocyigit.quickcar.widgets
        INFOPLIST_FILE: QuickCarWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: QuickCarWidgets/QuickCarWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: YES

  QuickCarTests:
    type: bundle.unit-test
    platform: iOS
    sources: [QuickCarTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.muhammetkocyigit.quickcar.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/QuickCar.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/QuickCar"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: QuickCar

  QuickCarUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [QuickCarUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.muhammetkocyigit.quickcar.uitests
    dependencies:
      - target: QuickCar

schemes:
  QuickCar:
    build:
      targets:
        QuickCar: all
        # QuickCarWidgets: all  # free Personal Team install
        QuickCarTests: [test]
        QuickCarUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuickCarTests
        - QuickCarUITests
