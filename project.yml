name: BMWCenter
options:
  bundleIdPrefix: com.muhammetkocyigit
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "9G9C976675"
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  BMWCenter:
    type: application
    platform: iOS
    sources:
      - path: BMWCenter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muhammetkocyigit.bmwcenter
        INFOPLIST_FILE: BMWCenter/Info.plist
        # Personal Team cannot provision CarPlay Driving Task on device.
        # Default = CarPlay (Simulator). Device SDK strips to empty entitlements.
        CODE_SIGN_ENTITLEMENTS: BMWCenter/Resources/BMWCenter-CarPlay.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": BMWCenter/Resources/BMWCenter.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_TESTABILITY: YES
    # Free Personal Team: widgets/App Groups disabled for local device install
    # dependencies:
    #   - target: BMWCenterWidgets
    #     embed: true

  BMWCenterWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BMWCenterWidgets
      - path: BMWCenter/Core/LiveActivity/TripActivityAttributes.swift
      - path: BMWCenter/Core/Widgets/WidgetDataStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.muhammetkocyigit.bmwcenter.widgets
        INFOPLIST_FILE: BMWCenterWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: BMWCenterWidgets/BMWCenterWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: YES

  BMWCenterTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BMWCenterTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.muhammetkocyigit.bmwcenter.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BMWCenter.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BMWCenter"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: BMWCenter

  BMWCenterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BMWCenterUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.muhammetkocyigit.bmwcenter.uitests
    dependencies:
      - target: BMWCenter

schemes:
  BMWCenter:
    build:
      targets:
        BMWCenter: all
        # BMWCenterWidgets: all  # free Personal Team install
        BMWCenterTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BMWCenterTests
