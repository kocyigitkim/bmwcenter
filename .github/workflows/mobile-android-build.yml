name: Mobile Android APK Build

on:
  push:
    branches:
      - master
      - "claude/**"
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

# A newer push supersedes an in-flight build; no point paying for both.
concurrency:
  group: mobile-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Gradle caches survive between runs; the native (CMake/NDK) outputs under
      # android/.cxx are the expensive part and are keyed on the lockfile.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache native build outputs
        uses: actions/cache@v4
        with:
          path: |
            mobile/android/.cxx
            mobile/android/app/.cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: |
            cxx-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android
        env:
          CI: "1"

      - name: Tune Gradle for CI
        working-directory: mobile/android
        run: |
          python3 - <<'PY'
          import pathlib

          # Replace rather than append: duplicate keys in a .properties file resolve to
          # the last one, which works but reads as a contradiction in the file.
          OVERRIDES = {
              # The generated defaults (2 GiB heap / 512 MiB metaspace) exhaust metaspace
              # during :app:packageRelease on this app and fail the build. ubuntu-latest
              # runners have 16 GB, so give the daemon real room.
              "org.gradle.jvmargs": "-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError",
              "org.gradle.parallel": "true",
              "org.gradle.caching": "true",
              # x86/x86_64 are emulator-only. Dropping them removes two full CMake/NDK
              # builds (~5 min) and roughly halves the APK. Every 64-bit phone —
              # effectively all Android hardware since ~2016 — runs arm64-v8a.
              "reactNativeArchitectures": "arm64-v8a",
          }

          path = pathlib.Path("gradle.properties")
          kept = [
              line
              for line in path.read_text().splitlines()
              if line.strip().startswith("#") or line.split("=", 1)[0].strip() not in OVERRIDES
          ]
          kept.append("")
          kept.append("# --- CI overrides (.github/workflows/mobile-android-build.yml) ---")
          kept += [f"{k}={v}" for k, v in OVERRIDES.items()]
          path.write_text("\n".join(kept) + "\n")

          for key in OVERRIDES:
              assert sum(1 for l in kept if l.startswith(f"{key}=")) == 1, f"{key} not uniquely set"
          print("Applied CI Gradle overrides.")
          PY

      - name: Decode release keystore
        working-directory: mobile/android/app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d -i > release.keystore
          if [ ! -s release.keystore ]; then
            echo "::error::Decoded release.keystore is empty. Check that ANDROID_KEYSTORE_BASE64 contains the full base64 content of the keystore file."
            exit 1
          fi

      - name: Configure release signing
        working-directory: mobile/android/app
        run: |
          python3 - <<'PY'
          import pathlib, sys

          path = pathlib.Path("build.gradle")
          text = path.read_text()

          SIGNING_CONFIGS_OLD = (
              "    signingConfigs {\n"
              "        debug {\n"
              "            storeFile file('debug.keystore')\n"
              "            storePassword 'android'\n"
              "            keyAlias 'androiddebugkey'\n"
              "            keyPassword 'android'\n"
              "        }\n"
              "    }\n"
          )
          SIGNING_CONFIGS_NEW = (
              # lintVital* across every module costs ~3 min and gates nothing for an
              # internally distributed build.
              "    lint {\n"
              "        checkReleaseBuilds false\n"
              "        abortOnError false\n"
              "    }\n"
              "    signingConfigs {\n"
              "        debug {\n"
              "            storeFile file('debug.keystore')\n"
              "            storePassword 'android'\n"
              "            keyAlias 'androiddebugkey'\n"
              "            keyPassword 'android'\n"
              "        }\n"
              "        release {\n"
              "            storeFile file('release.keystore')\n"
              "            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')\n"
              "            keyAlias System.getenv('ANDROID_KEY_ALIAS')\n"
              "            keyPassword System.getenv('ANDROID_KEY_PASSWORD')\n"
              "        }\n"
              "    }\n"
          )

          RELEASE_BLOCK_OLD = (
              "        release {\n"
              "            // Caution! In production, you need to generate your own keystore file.\n"
              "            // see https://reactnative.dev/docs/signed-apk-android.\n"
              "            signingConfig signingConfigs.debug\n"
          )
          RELEASE_BLOCK_NEW = (
              "        release {\n"
              "            signingConfig signingConfigs.release\n"
          )

          if SIGNING_CONFIGS_OLD not in text:
              sys.exit("Could not find expected signingConfigs block in build.gradle - aborting so we don't ship an unsigned/misconfigured build.")
          if RELEASE_BLOCK_OLD not in text:
              sys.exit("Could not find expected release buildType block in build.gradle - aborting so we don't ship an unsigned/misconfigured build.")

          text = text.replace(SIGNING_CONFIGS_OLD, SIGNING_CONFIGS_NEW)
          text = text.replace(RELEASE_BLOCK_OLD, RELEASE_BLOCK_NEW)

          path.write_text(text)
          print("Patched build.gradle with release signing config.")
          PY

      - name: Build release APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::One or more signing secrets (ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) are not set."
            exit 1
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --build-cache --stacktrace

      - name: Locate APK
        id: apk
        working-directory: mobile/android
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickcar-release-apk
          path: mobile/android/${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-apk-${{ github.run_number }}
          name: QuickCar Mobile APK (build ${{ github.run_number }})
          body: |
            Otomatik derlenen ve imzalanmış QuickCar Android release APK'sı.
            Kaynak commit: ${{ github.sha }}
          files: mobile/android/${{ steps.apk.outputs.path }}
          draft: false
          prerelease: true
